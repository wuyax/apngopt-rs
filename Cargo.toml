[package]
name = "apngopt-rs"
version = "0.1.0"
edition = "2021"
authors = ["wuyax"]
description = "A fast, memory-safe, 1:1 port of the classic C++ apngopt in pure Rust."
repository = "https://github.com/wuyax/apngopt-rs"
license = "Zlib"
readme = "README.md"
keywords = ["apng", "png", "optimization", "compression", "imagequant"]
categories = ["multimedia::images", "command-line-utilities"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
crc32fast = "1.5.0"
flate2 = "1.1.9"
lzma-rs = "0.3.0"
nom = "8.0.0"
png = "0.18.1"
zopfli = "0.8.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11.0"
imagequant = { version = "4.4.1", features = ["threads"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
imagequant = { version = "4.4.1", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
assert_cmd = "2.2.0"
